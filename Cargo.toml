[package]
name = "dep-scan"
version = "1.2.1"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform CLI tool that scans dependencies for supply chain attacks before installation"
license = "MIT"
repository = "https://github.com/tkdtaylor/dep-scan"
homepage = "https://github.com/tkdtaylor/dep-scan"
keywords = ["security", "supply-chain", "dependency-scanning", "npm", "pypi"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
# Task 032 — npm provenance attestation verification
# p256 for ECDSA P-256 signature verification (Fulcio leaf cert key type for npm)
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
# Task 035 — full Fulcio root chain verification.
# `verify` enables ring-backed signature verification for chain walk (P-256,
# P-384 ecdsa, RSA — Fulcio v1 root + intermediate are both P-384/SHA384, leaf
# certs are P-256). `ring` is already a transitive dep via rustls-tls so this
# adds no new top-level dependencies.
x509-parser = { version = "0.18", features = ["verify"] }
# sha2 for computing digests (already transitively pulled in by many deps)
sha2 = "0.10"
# Task 034 — Go sumdb Ed25519 signature verification
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
# Task 042 — Harden TempReqFile against predictable filename / symlink attack.
# NamedTempFile uses O_CREAT|O_EXCL + mode 0600 on Unix, so no pre-existing
# symlink can redirect writes. Promoted from dev-dependency to runtime dependency.
tempfile = "3"
# Task 084 — CycloneDX/SPDX SBOM generation: UUIDv4 for serialNumber / documentNamespace.
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
# Ed25519 key generation for tests (uses OsRng from the rand crate ecosystem)
rand_core = { version = "0.6", features = ["getrandom"] }
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
# Task 035 — generate test cert chains (test trust root + leaves with custom EKUs)
rcgen = "0.13"
# Task 059 — umask manipulation in TOCTOU tests (already a transitive dep; declared
# here so cfg(test) code can call libc::umask on Unix)
libc = "0.2"
