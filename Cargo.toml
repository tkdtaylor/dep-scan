[package]
name = "dep-scan"
version = "1.2.1"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform CLI tool that scans dependencies for supply chain attacks before installation"
license = "MIT"
repository = "https://github.com/tkdtaylor/dep-scan"
homepage = "https://github.com/tkdtaylor/dep-scan"
keywords = ["security", "supply-chain", "dependency-scanning", "npm", "pypi"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
# Task 032 — npm provenance attestation verification
# p256 for ECDSA P-256 signature verification (Fulcio leaf cert key type for npm)
p256 = { version = "0.13", features = ["ecdsa", "pem"] }
# Task 035 — full Fulcio root chain verification.
# `verify` enables ring-backed signature verification for chain walk (P-256,
# P-384 ecdsa, RSA — Fulcio v1 root + intermediate are both P-384/SHA384, leaf
# certs are P-256). `ring` is already a transitive dep via rustls-tls so this
# adds no new top-level dependencies.
x509-parser = { version = "0.18", features = ["verify"] }
# sha2 for computing digests (already transitively pulled in by many deps)
sha2 = "0.10"
# Task 034 — Go sumdb Ed25519 signature verification.
# Task 087 — operator-key offline signer loads/parses PEM PKCS#8 Ed25519 keys.
# `pkcs8` + `pem` enable DecodePrivateKey/EncodePrivateKey for the on-disk key
# format; both pull in `pkcs8`/`pem-rfc7468` which are already in the tree via
# p256, so this adds no new top-level dependency.
ed25519-dalek = { version = "2.2.0", features = ["rand_core", "pkcs8", "pem"] }
# Task 042 — Harden TempReqFile against predictable filename / symlink attack.
# NamedTempFile uses O_CREAT|O_EXCL + mode 0600 on Unix, so no pre-existing
# symlink can redirect writes. Promoted from dev-dependency to runtime dependency.
tempfile = "3"
# Task 084 — CycloneDX/SPDX SBOM generation: UUIDv4 for serialNumber / documentNamespace.
uuid = { version = "1", features = ["v4"] }
# Task 086 — Ed25519 key generation for the default interchange signer (OsRng).
# Promoted from dev-dependency: the test-key signer is used on the live
# `run_check` interchange path until task 087 wires the production identity.
rand_core = { version = "0.6", features = ["getrandom"] }
# Task 096 — sandboxed VCS fetch client (ADR 008 piece 2).
# Pure-Rust git (gitoxide) so the default fetch path works with NO system `git`
# on PATH (ADR 001 single-binary constraint).  Minimal feature set:
#   - sha1: object hashing (required; lives in gix's default set, so it must be
#           re-added explicitly after default-features = false or gix-hash fails
#           to compile — its Kind enum variants are cfg-gated on the hash feature).
#   - blocking-network-client + blocking-http-transport-reqwest-rust-tls:
#           HTTPS fetch over the existing reqwest+rustls stack (no OpenSSL, no
#           new TLS backend).
#   - max-performance-safe: pure-Rust zlib (zlib-rs), no C zlib-ng.
# Deliberately NOT enabled: worktree checkout/mutation (would run smudge/clean
# filters), any submodule feature, curl transport, ssh transport.  We fetch into
# an ephemeral object store and materialise blobs ourselves with our own
# path-traversal / symlink / absolute-path sandbox checks (REQ-096-04).
gix = { version = "0.84.0", default-features = false, features = ["sha1", "max-performance-safe", "blocking-network-client", "blocking-http-transport-reqwest-rust-tls"] }

[dev-dependencies]
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
# Task 035 — generate test cert chains (test trust root + leaves with custom EKUs)
rcgen = "0.13"
# Task 059 — umask manipulation in TOCTOU tests (already a transitive dep; declared
# here so cfg(test) code can call libc::umask on Unix)
libc = "0.2"
