[package]
name = "dep-scan"
version = "1.0.0"
edition = "2024"
description = "A cross-platform CLI tool that scans dependencies for supply chain attacks before installation"
license = "MIT"
repository = "https://github.com/tkdtaylor/dep-scan"
homepage = "https://github.com/tkdtaylor/dep-scan"
keywords = ["security", "supply-chain", "dependency-scanning", "npm", "pypi"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
base64 = "0.22"
# Task 032 — npm provenance attestation verification
# p256 for ECDSA P-256 signature verification (Fulcio leaf cert key type for npm)
p256 = { version = "0.13", features = ["ecdsa"] }
# x509-parser for X.509 certificate chain parsing
x509-parser = "0.16"
# sha2 for computing digests (already transitively pulled in by many deps)
sha2 = "0.10"
# Task 034 — Go sumdb Ed25519 signature verification
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }

[dev-dependencies]
# Ed25519 key generation for tests (uses OsRng from the rand crate ecosystem)
rand_core = { version = "0.6", features = ["getrandom"] }
wiremock = "0.6"
assert_cmd = "2"
predicates = "3"
tempfile = "3"
