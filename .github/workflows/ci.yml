name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Run both the declared MSRV and current stable so we catch drift in
        # both directions: a future stable lint that rejects 1.88-era code, and
        # a future stable feature accidentally used in new code.
        rust: ["1.88", stable]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --all-targets

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  dogfood:
    name: Dog-food (dep-scan scans its own Cargo.lock)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build dep-scan
        run: cargo build --release

      - name: Scan own Cargo.lock
        run: |
          ./target/release/dep-scan check \
            --lockfile Cargo.lock \
            --lockfile-type crates \
            --json \
            2>/dev/null \
            > /tmp/dogfood.json || true

      - name: Run dogfood gate
        run: |
          # scripts/dogfood-gate.py reads .dep-scan-dogfood-allowlist.toml
          # and downgrades acknowledged blocks to ::warning:: annotations.
          # Unacknowledged blocks emit ::error:: and fail the build.
          python3 scripts/dogfood-gate.py /tmp/dogfood.json
